name: Build Flit APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build, test and inspect (output captured to build-log.txt)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" | tee build-log.txt
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          {
            ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
            ls -l "$APK"
            sha256sum "$APK"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$BT/aapt2" dump badging "$APK" | head -25
            "$BT/apksigner" verify --print-certs "$APK" | head -5
          } 2>&1 | tee -a build-log.txt

      - name: Collect test results
        if: always()
        run: |
          mkdir -p out
          cp build-log.txt out/ || true
          cp app/build/outputs/apk/debug/app-debug.apk out/flit-debug.apk || true
          for f in app/build/test-results/testDebugUnitTest/*.xml; do [ -f "$f" ] && cp "$f" out/; done
          echo "${{ steps.build.outcome }}" > out/OUTCOME.txt

      - name: Publish to build-output branch
        if: always()
        run: |
          cd out
          git init -q -b build-output
          git config user.name "flit-ci"
          git config user.email "flit-ci@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.sha }} (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-output

      - name: Publish GitHub Release
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/flit-debug.apk \
            --title "Flit debug build" \
            --notes "Debug APK built from ${{ github.sha }}. Install on Android 8.0+." \
            --target ${{ github.sha }}

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
